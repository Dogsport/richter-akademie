<!DOCTYPE html>

<style>
        body {
            background-color: #F5F5F7;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .quiz-card-shadow {
            box-shadow: 0px 4px 24px rgba(0, 0, 0, 0.04);
        }
        .answer-option:hover {
            border-color: #007AFF;
            background-color: #f9f9ff;
        }
        .answer-option.selected {
            border-color: #007AFF;
            border-width: 2px;
            background-color: #F0F7FF;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
<!-- Top Navigation Bar (Shared Component Style) -->
<header class="bg-surface docked full-width top-0 border-b border-outline-variant shadow-sm z-50">
<div class="flex justify-between items-center w-full px-margin-desktop max-w-container-max mx-auto h-16">
<div class="flex items-center gap-stack-md">
<span class="font-headline-md text-headline-md font-bold text-primary">Hundesport Richter Akademie</span>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined">exit_to_app</span>
<span class="font-label-md text-label-md">Save &amp; Exit</span>
</button>
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant">
<img alt="Judge Profile Avatar" class="w-full h-full object-cover" data-alt="A professional headshot of a middle-aged man with short gray hair and a friendly expression, wearing a navy blue polo shirt. The background is a clean, softly blurred indoor office setting with neutral colors. The lighting is soft and even, creating a polished corporate aesthetic suitable for an academic professional portal." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmEdG32A71i7CnDbIkRmaBug0ZIge7P8Dlj1dsiUz4ovAHNMKVKFP6aDvjTUVMkxKTn98zkBJOTq4G0d57DouaqM3pD9_-Qfs8tAsnxf4Ze2SBU-5rjkGlc4LoIR4LKL5wQSz-tBnlMe2DVo_2a-55cc2PAqOqw4G32O2jfFzbPfN6C8wpISh2Odoklfwz1J3lLXpdaiEsfJDZInpoii9SVnMzSQLdfPJjz9WOhXVvU2H496Jd2vHVaZH2bB6HzR37y6EQjHbev_7T"/>
</div>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center py-stack-lg px-margin-mobile md:px-margin-desktop max-w-[800px] mx-auto w-full">
<!-- Header Section: Progress & Status -->
<div class="w-full mb-stack-lg space-y-stack-sm">
<div class="flex justify-between items-end">
<div>
<span class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Module 04: Trial Regulations</span>
<h2 class="font-headline-md text-headline-md text-on-surface mt-1">Question 4 of 15</h2>
</div>
<div class="text-right">
<span class="font-label-md text-label-md font-bold text-primary">25% Complete</span>
</div>
</div>
<!-- Progress Bar -->
<div class="h-[4px] w-full bg-[#D2D2D7] rounded-full overflow-hidden">
<div class="h-full bg-[#34C759] transition-all duration-500 ease-out" id="progress-fill" style="width: 25.33%;"></div>
</div>
</div>
<!-- Question Canvas -->
<div class="w-full bg-white rounded-[20px] p-stack-lg quiz-card-shadow border border-[#D2D2D7]/30 mb-stack-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface leading-tight">
                Based on the video provided in the previous section, what is the correct point deduction for the dog's position during the long attack if it lacks sufficient grip?
            </h1>
</div>
<!-- Answer Options -->
<div class="w-full space-y-stack-md" id="options-container">
<!-- Option 1 -->
<label class="answer-option group block w-full bg-white border border-[#D2D2D7] rounded-xl p-stack-md cursor-pointer transition-all duration-200 quiz-card-shadow flex items-center gap-stack-md">
<input class="w-5 h-5 text-primary border-[#D2D2D7] focus:ring-primary" name="quiz-answer" type="radio"/>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">Minor deduction: 0.5 - 1.0 points</span>
</div>
</label>
<!-- Option 2 -->
<label class="answer-option group block w-full bg-white border border-[#D2D2D7] rounded-xl p-stack-md cursor-pointer transition-all duration-200 quiz-card-shadow flex items-center gap-stack-md">
<input class="w-5 h-5 text-primary border-[#D2D2D7] focus:ring-primary" name="quiz-answer" type="radio"/>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">Substantial deduction: 1.5 - 2.5 points</span>
</div>
</label>
<!-- Option 3 -->
<label class="answer-option group block w-full bg-white border border-[#D2D2D7] rounded-xl p-stack-md cursor-pointer transition-all duration-200 quiz-card-shadow flex items-center gap-stack-md">
<input class="w-5 h-5 text-primary border-[#D2D2D7] focus:ring-primary" name="quiz-answer" type="radio"/>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">High deduction: 3.0 - 5.0 points</span>
</div>
</label>
<!-- Option 4 -->
<label class="answer-option group block w-full bg-white border border-[#D2D2D7] rounded-xl p-stack-md cursor-pointer transition-all duration-200 quiz-card-shadow flex items-center gap-stack-md">
<input class="w-5 h-5 text-primary border-[#D2D2D7] focus:ring-primary" name="quiz-answer" type="radio"/>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">Immediate disqualification for lack of courage</span>
</div>
</label>
</div>
<!-- Sticky Bottom Controls -->
<div class="w-full mt-stack-lg pt-stack-lg border-t border-[#D2D2D7] flex justify-between items-center">
<button class="bg-[#E5E5EA] text-primary px-8 py-3 rounded-lg font-label-md text-label-md font-semibold hover:bg-[#D1D1D6] transition-colors flex items-center gap-2">
<span class="material-symbols-outlined">arrow_back</span>
                Previous
            </button>
<div class="flex items-center gap-stack-md">
<button class="text-primary font-label-md text-label-md font-semibold hover:underline px-4">
                    Skip Question
                </button>
<button class="bg-primary text-white px-10 py-3 rounded-lg font-label-md text-label-md font-semibold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all active:scale-[0.98] flex items-center gap-2" id="btn-next">
                    Next Question
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Visual Polish: Background Gradients -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-30">
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-tertiary/5 blur-[100px] rounded-full"></div>
</div>
<script>
        // Simple Interaction Logic
        document.querySelectorAll('.answer-option').forEach(option => {
            option.addEventListener('click', function() {
                // Remove selected state from all
                document.querySelectorAll('.answer-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                // Add to current
                this.classList.add('selected');
                // Auto-check radio
                this.querySelector('input').checked = true;
            });
        });

        const btnNext = document.getElementById('btn-next');
        btnNext.addEventListener('click', () => {
            // Visual feedback for interaction
            btnNext.innerHTML = 'Saving...';
            setTimeout(() => {
                btnNext.innerHTML = 'Next Question <span class="material-symbols-outlined">arrow_forward</span>';
            }, 800);
        });
    </script>
</body></html>
